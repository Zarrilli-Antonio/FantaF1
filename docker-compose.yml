services:
  # PHP Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fantaf1-app
    restart: unless-stopped
    working_dir: /var/www
    env_file:
      - .env
    volumes:
      - ./:/var/www
      - vendor:/var/www/vendor
      - public-build:/var/www/public/build
      - ./php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - fantaf1
    depends_on:
      - db
      - redis

  # Queue worker (calcolo punteggi fantasy, job differiti)
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fantaf1-queue
    restart: unless-stopped
    working_dir: /var/www
    env_file:
      - .env
    command: php artisan queue:work --tries=3 --sleep=3
    volumes:
      - ./:/var/www
      - vendor:/var/www/vendor
      - public-build:/var/www/public/build
      - ./php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - fantaf1
    depends_on:
      - db
      - redis

  # Scheduler (sync calendario/risultati F1, risoluzione round d'asta)
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fantaf1-scheduler
    restart: unless-stopped
    working_dir: /var/www
    env_file:
      - .env
    command: php artisan schedule:work
    volumes:
      - ./:/var/www
      - vendor:/var/www/vendor
      - public-build:/var/www/public/build
      - ./php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - fantaf1
    depends_on:
      - db
      - redis

  # Nginx Service — published directly on the host so the app works out of
  # the box with no reverse proxy required. Put it behind Traefik/Caddy/nginx
  # of your own via a docker-compose.override.yml if you want TLS/a domain.
  nginx:
    image: nginx:alpine
    container_name: fantaf1-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www
      - public-build:/var/www/public/build
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - fantaf1
    depends_on:
      - app

  # MySQL Service
  db:
    image: mysql:8.0
    container_name: fantaf1-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-laravel}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - fantaf1

  # Redis Service
  redis:
    image: redis:alpine
    container_name: fantaf1-redis
    restart: unless-stopped
    networks:
      - fantaf1

  # phpMyAdmin Service (optional — drop this service if you don't want it)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: fantaf1-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "8081:80"
    networks:
      - fantaf1
    depends_on:
      - db

networks:
  fantaf1:
    driver: bridge

volumes:
  dbdata:
    driver: local
  vendor:
    driver: local
  public-build:
    driver: local
